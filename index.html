<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>어휘테스트</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--bg:#eef2f6;--card:#fff;--ink:#16233f;--sub:#5b6882;--line:#d5dce7;--main:#0f766e;--mainbg:#d9f0ec;--bad:#b4401a;--badbg:#f9e3da;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10172a;--card:#19223a;--ink:#e8edf7;--sub:#9aa7c2;--line:#2b3656;--main:#4fd1c0;--mainbg:#143a3a;--bad:#ff9a73;--badbg:#44261c}}
:root[data-theme="dark"]{--bg:#10172a;--card:#19223a;--ink:#e8edf7;--sub:#9aa7c2;--line:#2b3656;--main:#4fd1c0;--mainbg:#143a3a;--bad:#ff9a73;--badbg:#44261c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;line-height:1.6}
main{max-width:640px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--sub);font-size:14px;margin:0 0 18px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.stat b{display:block;font-size:24px;line-height:1.2}
.stat span{font-size:12px;color:var(--sub)}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0 18px}
.bar i{display:block;height:100%;background:var(--main);width:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}
.row label{font-size:13px;color:var(--sub);width:100%;margin-bottom:-2px}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);padding:8px 14px;border-radius:20px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--main);border-color:var(--main);color:var(--bg)}
button:focus-visible{outline:3px solid var(--main);outline-offset:2px}
.go{width:100%;padding:14px;border:0;border-radius:10px;background:var(--main);color:var(--bg);font:inherit;font-weight:700;font-size:16px;cursor:pointer}
.go:disabled{opacity:.45;cursor:default}
.q{font-size:34px;font-weight:700;text-align:center;margin:18px 0 22px;word-break:keep-all}
.q.ko{font-size:26px}
.top{display:flex;justify-content:space-between;font-size:13px;color:var(--sub)}
.opt{display:block;width:100%;text-align:left;margin-bottom:8px;padding:13px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:16px;cursor:pointer}
.opt.ok{background:var(--mainbg);border-color:var(--main)}
.opt.no{background:var(--badbg);border-color:var(--bad)}
.opt:disabled{cursor:default}
.big{font-size:44px;font-weight:700;text-align:center;margin:8px 0}
.wrong{margin:0;padding:0;list-style:none}
.wrong li{padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.wrong b{margin-right:8px}
.link{background:none;border:0;color:var(--sub);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer;padding:6px 0}
.hide{display:none}
</style>
</head>
<body>
<main>
<h1>어휘테스트</h1>
<p class="sub">중상급 빈출단어 <span id="total"></span>개 · 랜덤 4지선다</p>

<section id="home">
  <div class="stats">
    <div class="stat"><b id="sMastered">0</b><span>외운 단어</span></div>
    <div class="stat"><b id="sAcc">-</b><span>정답률</span></div>
    <div class="stat"><b id="sBest">0</b><span>최고 연속 정답</span></div>
  </div>
  <div class="bar" role="progressbar" aria-label="암기 진행률"><i id="prog"></i></div>
  <div class="panel">
    <div class="row"><label>출제 방향</label>
      <button class="chip on" data-k="dir" data-v="en">영어 → 한글</button>
      <button class="chip" data-k="dir" data-v="ko">한글 → 영어</button>
      <button class="chip" data-k="dir" data-v="mix">섞어서</button></div>
    <div class="row"><label>문제 수</label>
      <button class="chip" data-k="n" data-v="10">10</button>
      <button class="chip on" data-k="n" data-v="20">20</button>
      <button class="chip" data-k="n" data-v="50">50</button></div>
    <div class="row"><label>범위</label>
      <button class="chip on" data-k="scope" data-v="all">전체</button>
      <button class="chip" data-k="scope" data-v="new">안 푼 단어 우선</button>
      <button class="chip" data-k="scope" data-v="wrong">오답 단어만</button></div>
    <button class="go" id="start">시작하기</button>
    <div id="msg" class="sub" style="margin:10px 0 0"></div>
  </div>
  <button class="link" id="reset">기록 초기화</button>
</section>

<section id="quiz" class="hide">
  <div class="top"><span id="qn"></span><span id="qs"></span></div>
  <div class="panel">
    <div class="q" id="qq"></div>
    <div id="opts"></div>
    <button class="go hide" id="next">다음 문제</button>
  </div>
</section>

<section id="result" class="hide">
  <div class="panel">
    <div class="sub" style="text-align:center;margin:0">이번 결과</div>
    <div class="big" id="rs"></div>
    <div class="sub" id="rt" style="text-align:center"></div>
    <ul class="wrong" id="wl"></ul>
  </div>
  <button class="go" id="again">다시 풀기</button>
  <button class="link" id="home2">처음으로</button>
</section>
</main>

<script>

renovate|개조하다

representative|대표, 담당자
reputation|평판
require|요구하다
reserve|예약하다

salary|급여
scarce|부족한
schedule|일정
secure|확보하다, 안전한

stipulate|규정하다, 명시하다
subscribe|구독하다
subsidiary|자회사
substantial|상당한
subtotal|소계
succeed|성공하다, 뒤를 잇다
sufficient|충분한
supervise|감독하다
supplement|보충하다
surplus|흑자, 잉여
suspend|중단하다
tentative|잠정적인
terminate|종료하다
thorough|철저한
transaction|거래
transfer|이동시키다, 전근
transit|운송
undergo|겪다
unanimous|만장일치의
update|갱신하다
utilize|활용하다
valid|유효한
vacant|비어 있는
vendor|판매업체
venue|장소
verify|확인하다, 검증하다
viable|실행 가능한
violate|위반하다
vital|필수적인
voucher|상품권, 쿠폰
waive|포기하다, 면제하다

const W=RAW.trim().split('\n').map(l=>{const [e,k]=l.split('|');return {e,k}});
const KEY='toeic_vocab_v1';
const $=id=>document.getElementById(id);
let S={seen:{},best:0};
try{S=Object.assign(S,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const opt={dir:'en',n:'20',scope:'all'};
let Q=[],qi=0,score=0,streak=0,wrongList=[],locked=false;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const show=id=>['home','quiz','result'].forEach(s=>$(s).classList.toggle('hide',s!==id));
function stats(){
  let right=0,tot=0,mast=0;
  for(const e in S.seen){const r=S.seen[e];right+=r.c;tot+=r.c+r.w;if(r.c>=2&&r.c>r.w)mast++}
  $('total').textContent=W.length;
  $('sMastered').textContent=mast;
  $('sAcc').textContent=tot?Math.round(right/tot*100)+'%':'-';
  $('sBest').textContent=S.best;
  $('prog').style.width=(mast/W.length*100)+'%';
  $('prog').parentElement.setAttribute('aria-valuenow',Math.round(mast/W.length*100));
}
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{
  document.querySelectorAll(`.chip[data-k="${b.dataset.k}"]`).forEach(x=>x.classList.remove('on'));
  b.classList.add('on');opt[b.dataset.k]=b.dataset.v;
});
$('start').onclick=()=>{
  let pool=W;
  if(opt.scope==='wrong')pool=W.filter(w=>S.seen[w.e]&&S.seen[w.e].w>0&&S.seen[w.e].c<=S.seen[w.e].w+1);
  if(!pool.length){$('msg').textContent='아직 오답 단어가 없어요. 전체 범위로 먼저 풀어보세요.';return}
  pool=shuffle(pool);
  if(opt.scope==='new')pool.sort((a,b)=>!!S.seen[a.e]-!!S.seen[b.e]);
  Q=pool.slice(0,+opt.n).map(w=>({w,dir:opt.dir==='mix'?(Math.random()<.5?'en':'ko'):opt.dir}));
  qi=0;score=0;streak=0;wrongList=[];$('msg').textContent='';
  show('quiz');ask();
};
function ask(){
  locked=false;const {w,dir}=Q[qi];
  $('qn').textContent=`${qi+1} / ${Q.length}`;$('qs').textContent=`정답 ${score}`;
  const q=$('qq');q.textContent=dir==='en'?w.e:w.k;q.className='q'+(dir==='ko'?' ko':'');
  const ds=shuffle(W.filter(x=>x.e!==w.e&&x.k!==w.k)).slice(0,3);
  const os=shuffle([w,...ds]);
  $('opts').innerHTML='';
  os.forEach((o,i)=>{
    const b=document.createElement('button');b.className='opt';
    b.textContent=`${i+1}. ${dir==='en'?o.k:o.e}`;
    b.onclick=()=>pick(b,o,w,os);b.dataset.e=o.e;
    $('opts').appendChild(b);
  });
  $('next').classList.add('hide');
}
function pick(btn,o,w){
  if(locked)return;locked=true;
  const r=S.seen[w.e]||(S.seen[w.e]={c:0,w:0});
  const ok=o.e===w.e;
  if(ok){r.c++;score++;streak++;if(streak>S.best)S.best=streak}else{r.w++;streak=0;wrongList.push(w)}
  btn.classList.add(ok?'ok':'no');
  document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.dataset.e===w.e)b.classList.add('ok')});
  $('qs').textContent=`정답 ${score}`;save();
  $('next').textContent=qi+1<Q.length?'다음 문제':'결과 보기';
  $('next').classList.remove('hide');$('next').focus();
}
$('next').onclick=()=>{qi++;if(qi<Q.length)ask();else finish()};
document.addEventListener('keydown',e=>{
  if($('quiz').classList.contains('hide'))return;
  if(!locked&&/^[1-4]$/.test(e.key)){const b=document.querySelectorAll('.opt')[+e.key-1];if(b)b.click()}
  else if(locked&&e.key==='Enter'){e.preventDefault();$('next').click()}
});
function finish(){
  show('result');
  $('rs').textContent=`${score} / ${Q.length}`;
  $('rt').textContent=wrongList.length?`틀린 단어 ${wrongList.length}개`:'모두 맞혔어요!';
  $('wl').innerHTML=wrongList.map(w=>`<li><b>${w.e}</b>${w.k}</li>`).join('');
  stats();
}
$('again').onclick=()=>$('start').click();
$('home2').onclick=()=>{show('home');stats()};
$('reset').onclick=()=>{if(confirm('학습 기록을 모두 지울까요?')){S={seen:{},best:0};save();stats()}};
stats();
</script>
</body>
</html>
